jobs: 20
cluster: >
  sbatch
  --parsable
  --partition=$PARTITION
  --cpus-per-task={threads}
  --mem={resources.mem_mb}
  --time={resources.time_min}
  --job-name=smk.{rule}.{params.slurm_job_label}
  --output=slurm_logs/%x.%j.out
  --error=slurm_logs/%x.%j.err
default-resources:
  - mem_mb=4000
  - time_min=240
latency-wait: 120
keep-going: true
rerun-incomplete: true
restart-times: 1
printshellcmds: true
