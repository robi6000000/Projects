jobs: 20
cluster: "/home/kenderes/run_sbatch.sh --parsable --partition=gen-compute1 --cpus-per-task={threads} --mem={resources.mem_mb} --time={resources.time_min} --job-name=smk.{rule} --output=slurm_logs/smk.{rule}.%j.out --error=slurm_logs/smk.{rule}.%j.err"
default-resources:
  - mem_mb=4000
  - time_min=240
latency-wait: 120
keep-going: true
rerun-incomplete: true
restart-times: 1
printshellcmds: true
